<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WEBSITE DEVELOPMENT SERVICES | High-Converting Custom Websites</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#030712',
              card: 'rgba(15, 23, 42, 0.45)',
              border: 'rgba(255, 255, 255, 0.12)',
              cyan: '#06B6D4',
              cyanHover: '#0891B2',
              accent: '#38BDF8'
            }
          },
          animation: {
            'mesh': 'mesh 18s ease infinite alternate',
            'marquee': 'marquee 25s linear infinite',
          },
          keyframes: {
            mesh: {
              '0%': { transform: 'scale(1) translate(0px, 0px) rotate(0deg)' },
              '50%': { transform: 'scale(1.2) translate(40px, -30px) rotate(10deg)' },
              '100%': { transform: 'scale(1) translate(-20px, 20px) rotate(-5deg)' },
            },
            marquee: {
              '0%': { transform: 'translateX(-50%)' },
              '100%': { transform: 'translateX(0)' }
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased overflow-x-hidden">

    </div>
    <div class="flex shrink-0 animate-marquee whitespace-nowrap min-w-full items-center justify-around gap-12" aria-hidden="true">
